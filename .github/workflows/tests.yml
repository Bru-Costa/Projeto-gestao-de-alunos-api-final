name: Testes de API

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  # Agendamento: a cada 7 minutos (horário UTC; o GitHub só executa agendamentos a partir da branch padrão)
  schedule:
    - cron: '*/7 * * * *'
  # Permite executar manualmente pela aba Actions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test
          ADMIN_EMAIL: admin@escola.com
          ADMIN_SENHA: admin123
